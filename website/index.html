<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumiNote — 标记, 理解, 记住</title>
<meta name="description" content="LumiNote · 浏览器扩展 — 标记任何网页上的句子, AI 解释上下文, 自动整理成你的灵感板.">
<link rel="icon" href="assets/logo-stack.svg">
<link rel="stylesheet" href="assets/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--ln-font-body);
    background: var(--ln-bg-app);
    background-attachment: fixed;
    color: var(--ln-fg1);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(26,107,74,0.22); color: inherit; }

  :root {
    --accent-deep:   #1a6b4a;
    --accent-bright: #2fa373;
    --accent-mid:    #228b5b;
    --accent-gradient: linear-gradient(135deg, var(--accent-deep), var(--accent-mid));
    --accent-gradient-hero: linear-gradient(135deg, var(--accent-deep), var(--accent-bright));
    --accent-glow: 0 2px 8px rgba(26,107,74,0.25);
    --accent-glow-lg: 0 8px 24px rgba(26,107,74,0.35);
    --page-bg: linear-gradient(135deg, #f0f5f1 0%, #e8f0ea 40%, #f2f6f0 70%, #edf5ef 100%);
  }
  body { background: var(--page-bg); background-attachment: fixed; }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-blobs .b {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at center, rgba(26,107,74,0.12), transparent 70%);
    filter: blur(40px);
  }
  .bg-blobs .b1 { top: -15%; left: -10%; width: 600px; height: 600px; }
  .bg-blobs .b2 { top: 35%; right: -15%; width: 700px; height: 700px;
    background: radial-gradient(circle at center, rgba(47,163,115,0.10), transparent 70%);
  }
  .bg-blobs .b3 { bottom: -20%; left: 20%; width: 500px; height: 500px;
    background: radial-gradient(circle at center, rgba(26,107,74,0.08), transparent 70%);
  }

  #app { position: relative; z-index: 1; }

  .glass {
    background: rgba(255,255,255,0.70);
    backdrop-filter: blur(16px) saturate(1.3);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid rgba(232,239,234,0.7);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04), inset 0 0 0 1px rgba(255,255,255,0.5);
  }

  .mono { font-family: var(--ln-font-mono); }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(8px,-6px); } }
  @keyframes pulse-green { 0%,100% { box-shadow: 0 0 0 0 rgba(26,107,74,0.4); } 50% { box-shadow: 0 0 0 8px rgba(26,107,74,0); } }
  @keyframes spin-slow { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(26,107,74,0.2); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(26,107,74,0.35); }
</style>
</head>
<body data-theme="deep">
  <div class="bg-blobs"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
  <div id="app"></div>

  <!--
    Deploy hook: implement window.explainPassage to wire up real AI explanations.
    Example (add before the React scripts below, pointing at your own backend):

    <script>
      window.explainPassage = async function(prompt, { lang } = {}) {
        const r = await fetch('/api/explain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, lang }),
        });
        if (!r.ok) throw new Error('explain failed');
        const { text } = await r.json();
        return text;
      };
    </script>

    If not defined, LiveDemo falls back to a deterministic mock so the page is still demo-able.
  -->

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/moodcards.jsx"></script>
  <script type="text/babel" src="components/Nav.jsx"></script>
  <script type="text/babel" src="components/Hero.jsx"></script>

  <script type="text/babel" src="components/Download.jsx"></script>
  <script type="text/babel" src="components/Privacy.jsx"></script>
  <script type="text/babel" src="components/Faq.jsx"></script>
  <script type="text/babel" src="components/Footer.jsx"></script>
  <script type="text/babel" src="components/App.jsx"></script>
</body>
</html>
