<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>LumiNote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/md3-tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-root">

    <!-- Header -->
    <header class="popup-header">
      <div class="popup-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#1a6b4a" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 17l10 5 10-5" stroke="#1a6b4a" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 12l10 5 10-5" stroke="#1a6b4a" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span>LumiNote</span>
      </div>
      <div class="header-actions">
        <button id="pdf-btn" class="icon-btn icon-btn--always" data-i18n-title="open_pdf_mode" title="PDF" aria-label="PDF">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 3.5h7l3.5 3.5V19a2 2 0 0 1-2 2h-8a2.5 2.5 0 0 1-2.5-2.5v-12A3 3 0 0 1 7 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M14 3.5V7h3.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <text x="12" y="16.2" text-anchor="middle" font-size="5.4" font-family="Arial, sans-serif" font-weight="700" fill="currentColor">PDF</text>
          </svg>
        </button>
        <button id="notebook-btn" class="icon-btn" data-i18n-title="open_notebook" title="Open full notebook">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" data-i18n-title="settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        </button>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="total-count">0</span>
        <span class="stat-label" data-i18n="marked">Marked</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="today-count">0</span>
        <span class="stat-label" data-i18n="today">Today</span>
      </div>
    </div>

    <!-- Search -->
    <div class="search-row">
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          id="search-input"
          class="search-input"
          data-i18n-placeholder="search_notebook"
          placeholder="Search your notebook…"
          autocomplete="off"
        >
        <button id="clear-search" class="clear-btn" style="display:none" aria-label="Clear search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Entry List -->
    <div class="entry-list" id="entry-list">
      <div class="empty-state" id="empty-state">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#c0c9c2" stroke-width="1.5">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <p data-i18n="no_marks">No marks yet.</p>
        <p class="empty-hint" data-i18n="no_marks_hint">Select text on any page and click <strong>Mark</strong> to start building your memory library.</p>
      </div>
    </div>

    <!-- Footer Actions -->
    <footer class="popup-footer" id="popup-footer" style="display:none">
      <button id="clear-all-btn" class="text-btn text-btn--danger" data-i18n="clear_all">Clear all</button>
    </footer>

  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
