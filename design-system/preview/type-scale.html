<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.scale { display: flex; flex-direction: column; gap: 14px; }
.spec { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding-bottom: 10px; border-bottom: 1px solid var(--ln-divider); }
.spec:last-child { border-bottom: none; padding-bottom: 0; }
.spec .text { color: var(--ln-fg1); font-family: 'Google Sans',sans-serif; }
.spec .meta { font-family: var(--ln-font-mono); font-size: 11px; color: var(--ln-fg4); white-space: nowrap; }
</style></head><body>
  <div class="scale">
    <div class="spec"><div class="text" style="font:700 32px/40px 'Google Sans';letter-spacing:-0.015em">Headline · h1</div><div class="meta">700 · 32 / 40</div></div>
    <div class="spec"><div class="text" style="font:700 22px/28px 'Google Sans'">Title · h2</div><div class="meta">700 · 22 / 28</div></div>
    <div class="spec"><div class="text" style="font:600 16px/24px 'Google Sans Text'">Section title</div><div class="meta">600 · 16 / 24</div></div>
    <div class="spec"><div class="text" style="font:500 14px/20px 'Google Sans Text';color:#404943">Field label</div><div class="meta">500 · 14 / 20</div></div>
    <div class="spec"><div class="text" style="font:400 14px/20px 'Google Sans Text';color:#404943">Body — Sign in to sync data and use free AI features.</div><div class="meta">400 · 14 / 20</div></div>
    <div class="spec"><div class="text" style="font:400 12px/16px 'Google Sans Text';color:#707973">Hint / caption — controls the language of the extension UI</div><div class="meta">400 · 12 / 16</div></div>
    <div class="spec"><div class="text" style="font:700 11px/16px 'Google Sans';letter-spacing:0.09em;text-transform:uppercase;color:#1a6b4a">Eyebrow / badge</div><div class="meta">700 · 11 · +0.09em</div></div>
  </div>
</body></html>
