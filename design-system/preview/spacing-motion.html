<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.box { padding: 14px; background: rgba(255,255,255,.7); border: 1px solid rgba(232,239,234,.6); border-radius: 14px; display: flex; flex-direction: column; gap: 8px; }
.box .nm { font: 600 12px 'Google Sans'; color: #1a6b4a; }
.box .v { font-family: var(--ln-font-mono); font-size: 11px; color: #404943; }
.curve { width: 100%; height: 30px; background: linear-gradient(90deg,#fff,#fff); position: relative; border-radius: 4px; }
.curve svg { width: 100%; height: 100%; }
.demo { width: 28px; height: 28px; background: linear-gradient(135deg,#1a6b4a,#2fa373); border-radius: 8px; transition: transform 600ms cubic-bezier(.2,.9,.3,1); animation: tap 2.4s ease-in-out infinite; }
@keyframes tap { 0%,80%,100%{transform:scale(1)} 40%{transform:scale(.94) translateY(0)} 50%{transform:scale(1) translateY(-2px)} }
</style></head><body>
  <div class="col2">
    <div class="box"><div class="nm">Standard</div><div class="v">cubic-bezier(.2,0,0,1) · 180–220ms</div><div class="v" style="color:#707973">state changes, hovers</div></div>
    <div class="box"><div class="nm">Emphasized</div><div class="v">cubic-bezier(.2,.9,.3,1) · 250ms</div><div class="v" style="color:#707973">modal/panel entrances</div></div>
    <div class="box"><div class="nm">Spring</div><div class="v">cubic-bezier(.3,1.3,.4,1) · 300ms</div><div class="v" style="color:#707973">modal pop-in</div></div>
    <div class="box" style="display:flex;align-items:center;justify-content:center;flex-direction:row;gap:14px">
      <div class="demo"></div>
      <div><div class="nm">Press</div><div class="v">scale(.97)</div></div>
    </div>
  </div>
</body></html>
