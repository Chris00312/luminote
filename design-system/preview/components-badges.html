<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font: 700 11px/1.4 'Google Sans'; letter-spacing: 0.04em; border: 1px solid transparent; }
.b-free { background: rgba(145,155,150,.12); color: #6c7a72; border-color: rgba(145,155,150,.25); }
.b-pro  { background: rgba(26,107,74,.14); color: #1a6b4a; border-color: rgba(26,107,74,.3); }
.b-max  { background: linear-gradient(135deg,#1a6b4a,#2fa373); color: #fff; }
.b-quota { background: rgba(26,107,74,.1); border: 1px solid rgba(26,107,74,.2); color: #1a6b4a; padding: 1px 7px; font-size: 10px; letter-spacing: .06em; border-radius: 9999px; }
.b-tag { font-size: 11px; font-weight: 600; color: #1a6b4a; background: rgba(26,107,74,.1); padding: 3px 9px; border-radius: 999px; font-family: 'Google Sans'; }
.ribbon { display: inline-block; padding: 4px 12px; background: linear-gradient(135deg,#1a6b4a,#2fa373); color: #fff; font: 700 11px 'Google Sans'; letter-spacing: 0.04em; border-radius: 999px; box-shadow: 0 4px 12px rgba(26,107,74,.3); }
.eye { display: inline-block; padding: 4px 11px; background: rgba(26,107,74,.12); color: #1a6b4a; font: 700 11px 'Google Sans'; letter-spacing: .09em; text-transform: uppercase; border-radius: 999px; }
</style></head><body>
  <div class="spread">
    <span class="badge b-free">FREE</span>
    <span class="badge b-pro">PRO</span>
    <span class="badge b-max">MAX</span>
    <span class="b-quota">FREE</span>
  </div>
  <div class="spread">
    <span class="b-tag">For power users</span>
    <span class="b-tag" style="background:rgba(145,155,150,.12);color:#6c7a72">Starter</span>
    <span class="ribbon">Most popular</span>
    <span class="eye">Cloud Sync</span>
  </div>
</body></html>
