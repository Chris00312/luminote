<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 20px; border-radius: 9999px; font: 500 14px/1 'Google Sans Text'; cursor: pointer; border: none; transition: all 150ms ease; }
.btn:active { transform: scale(0.97); }
.filled { background: linear-gradient(135deg,#1a6b4a,#228b5b); color: #fff; box-shadow: 0 2px 10px rgba(26,107,74,.25); }
.tonal { background: rgba(26,107,74,.12); color: #1a6b4a; }
.outlined { background: rgba(255,255,255,.5); color: #1a6b4a; border: 1.5px solid rgba(26,107,74,.4); backdrop-filter: blur(6px); }
.ghost { background: transparent; color: #1a6b4a; border: 1px solid rgba(26,107,74,.25); padding: 8px 14px; border-radius: 10px; font-weight: 500; font-size: 13px; }
.text { background: transparent; color: #1a6b4a; }
.sub-prim { background: linear-gradient(135deg,#1a6b4a,#228b5b); color: #fff; padding: 9px 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(26,107,74,.25); font: 600 13px 'Google Sans'; }
svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.5; fill: none; }
</style></head><body>
  <div class="spread">
    <button class="btn filled"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Save Settings</button>
    <button class="btn tonal">Sync Now</button>
    <button class="btn outlined">Test Connection</button>
  </div>
  <div class="spread">
    <button class="btn text">Sign out</button>
    <button class="ghost">Manage</button>
    <button class="sub-prim">View plans →</button>
  </div>
</body></html>
