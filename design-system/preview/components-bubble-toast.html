<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.bubble { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 9999px; background: linear-gradient(135deg,#1a6b4a,#2fa373); color: #fff; font: 600 13px 'Google Sans'; box-shadow: 0 4px 14px rgba(26,107,74,.35), inset 0 1px 0 rgba(255,255,255,.18); cursor: pointer; }
.bubble svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.5; fill: none; }
.depth-pill { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(26,107,74,.08); }
.depth-pill button { padding: 6px 14px; border: none; background: transparent; border-radius: 999px; font: 600 12px 'Google Sans'; color: #5a6560; cursor: pointer; }
.depth-pill button.active { background: #fff; color: #1a6b4a; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.toast { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(25,28,26,0.92); color: #fff; border-radius: 12px; font: 13px 'Google Sans Text'; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast .undo { color: #adf2cc; font-weight: 600; cursor: pointer; }
</style></head><body>
  <div class="row" style="align-items:center">
    <div class="bubble">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg> Mark
    </div>
    <div class="depth-pill">
      <button>Brief</button>
      <button class="active">Detailed</button>
      <button>Deep</button>
    </div>
  </div>
  <div class="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#adf2cc" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    Saved to memory · <span class="undo">Undo</span>
  </div>
</body></html>
