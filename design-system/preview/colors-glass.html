<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.app { padding: 24px; border-radius: 18px; background: linear-gradient(135deg,#f0f5f1 0%,#e8f0ea 40%,#f2f6f0 70%,#edf5ef 100%); display: flex; flex-direction: column; gap: 14px; }
.glass { background: rgba(255,255,255,0.6); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid rgba(232,239,234,0.6); border-radius: 20px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.04), inset 0 0 0 1px rgba(255,255,255,0.5); }
.glass h4 { font: var(--ln-t-title-md); color: var(--ln-fg1); margin-bottom: 4px; }
.glass p { font: var(--ln-t-body-sm); color: var(--ln-fg3); }
.glass-row { display: flex; gap: 12px; }
.glass-row .glass { flex: 1; }
</style></head><body>
  <div class="app">
    <div class="glass">
      <h4>Glass surface — primary card</h4>
      <p>rgba(255,.6) · blur(16px) saturate(1.3) · 20px radius · soft outer shadow + 1px inner white highlight.</p>
    </div>
    <div class="glass-row">
      <div class="glass" style="border-radius:16px;padding:14px;"><h4 style="font-size:14px">Inline glass</h4><p>radius 16, padding 14</p></div>
      <div class="glass" style="background:rgba(238,247,241,0.5);border-radius:16px;padding:14px;"><h4 style="font-size:14px">Mint-tinted glass</h4><p>quota / sync surfaces</p></div>
    </div>
  </div>
</body></html>
