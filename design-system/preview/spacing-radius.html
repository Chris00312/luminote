<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.row { align-items: flex-end; }
.r { background: rgba(255,255,255,0.85); border: 1px solid var(--ln-outline-variant); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; box-shadow: var(--ln-elev-1); padding: 4px; }
.r .v { font-family: var(--ln-font-mono); font-size: 11px; color: var(--ln-fg2); }
.r .n { font-size: 10px; color: var(--ln-fg4); }
</style></head><body>
  <div class="row">
    <div class="r" style="width:48px;height:48px;border-radius:4px"><div class="v">4</div><div class="n">xs</div></div>
    <div class="r" style="width:64px;height:64px;border-radius:8px"><div class="v">8</div><div class="n">sm</div></div>
    <div class="r" style="width:80px;height:80px;border-radius:12px"><div class="v">12</div><div class="n">md</div></div>
    <div class="r" style="width:96px;height:96px;border-radius:16px"><div class="v">16</div><div class="n">lg</div></div>
    <div class="r" style="width:110px;height:110px;border-radius:20px"><div class="v">20</div><div class="n">xl</div></div>
    <div class="r" style="width:120px;height:120px;border-radius:22px"><div class="v">22</div><div class="n">2xl</div></div>
    <div class="r" style="width:130px;height:64px;border-radius:9999px"><div class="v">9999</div><div class="n">pill</div></div>
  </div>
</body></html>
