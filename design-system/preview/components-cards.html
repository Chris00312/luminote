<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.card { background: rgba(255,255,255,.7); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid rgba(232,239,234,.6); border-radius: 20px; padding: 16px 18px; box-shadow: 0 2px 8px rgba(0,0,0,.04), inset 0 0 0 1px rgba(255,255,255,.5); display: flex; flex-direction: column; gap: 10px; max-width: 320px; }
.card .src { font: 11px 'Google Sans Text'; color: #707973; display: flex; align-items: center; gap: 6px; }
.card .src .dot { width: 10px; height: 10px; border-radius: 2px; background: linear-gradient(135deg,#1a6b4a,#2fa373); flex-shrink: 0; }
.card .quote { font: 14px/1.5 Georgia, serif; color: #404943; padding-left: 10px; border-left: 3px solid rgba(26,107,74,.4); }
.card .ai { font: 13px/1.55 'Google Sans Text'; color: #191c1a; }
.card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font: 11px 'Google Sans'; padding: 2px 8px; background: rgba(26,107,74,.08); color: #1a6b4a; border-radius: 999px; }
.mb { width: 220px; height: 140px; border-radius: 22px; background: rgba(255,255,255,.85); backdrop-filter: blur(20px); border: 1px solid rgba(232,239,234,.7); padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08), inset 0 0 0 1px rgba(255,255,255,.55); display: flex; flex-direction: column; gap: 6px; }
.mb .placeholder { flex: 1; background: linear-gradient(135deg,rgba(26,107,74,.12),rgba(47,163,115,.18)); border-radius: 14px; }
.mb .cap { font: 12px 'Google Sans Text'; color: #404943; }
</style></head><body>
  <div class="row" style="align-items:flex-start;gap:16px">
    <div class="card">
      <div class="src"><span class="dot"></span> nature.com · The geometry of biological time</div>
      <div class="quote">Circadian rhythms organize behavior on roughly 24-hour cycles…</div>
      <div class="ai">A built-in 24h timer, set by light and reset every morning. Misalignment harms sleep, mood, metabolism.</div>
      <div class="tags"><span class="tag">circadian</span><span class="tag">biology</span><span class="tag">sleep</span></div>
    </div>
    <div class="mb">
      <div class="placeholder"></div>
      <div class="cap">Moodboard glass card · 22r · blur 20</div>
    </div>
  </div>
</body></html>
