<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.logo-row { display: flex; align-items: center; gap: 22px; padding: 14px 0; }
.lbl { font: 11px 'Google Sans Text'; color: #5a6560; margin-top: 6px; text-align: center; }
.tile { background: #1a6b4a; width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(26,107,74,.3); }
.tile svg { stroke: #fff; }
.wm { display: flex; align-items: center; gap: 10px; }
.wm svg { width: 32px; height: 32px; }
.wm .name { font: 700 22px 'Google Sans'; color: #1a6b4a; letter-spacing: -0.01em; }
</style></head><body>
  <div class="logo-row">
    <div>
      <div class="tile">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="#fff" stroke="none"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/></svg>
      </div>
      <div class="lbl">App icon · 128/48/16</div>
    </div>
    <div>
      <div class="wm">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1a6b4a" stroke-width="2" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/></svg>
        <div class="name">LumiNote</div>
      </div>
      <div class="lbl">Wordmark · header lockup</div>
    </div>
    <div>
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none">
        <polygon points="24,5 43,24 24,43 5,24" fill="#1a6b4a"/>
        <polyline points="14,24 22,32 34,18" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="lbl">Onboarding mark</div>
    </div>
  </div>
</body></html>
