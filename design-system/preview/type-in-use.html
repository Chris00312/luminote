<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.example { display: flex; flex-direction: column; gap: 6px; padding: 18px; background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); border: 1px solid rgba(232,239,234,0.6); border-radius: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.eye { font: 700 11px/16px 'Google Sans'; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ln-primary); background: rgba(26,107,74,0.12); padding: 4px 11px; border-radius: 999px; align-self: flex-start; margin-bottom: 4px; }
h1.h { font: 700 26px/32px 'Google Sans'; color: var(--ln-fg1); letter-spacing: -0.015em; margin: 0; }
p.body { font: 400 14px/22px 'Google Sans Text'; color: var(--ln-fg2); margin: 0; }
.kbd { font-family: 'Roboto Mono',monospace; font-size: 12px; padding: 3px 7px; background: rgba(238,244,239,0.6); border: 1.5px solid rgba(192,201,194,0.5); border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); color: var(--ln-fg1); }
</style></head><body>
  <div class="example">
    <span class="eye">Cloud Sync</span>
    <h1 class="h">Sign in to sync your memories</h1>
    <p class="body">Press <span class="kbd">Ctrl</span> <span class="kbd">Shift</span> <span class="kbd">E</span> on any page to mark text. LumiNote saves it to your library and writes a brief explanation in the background.</p>
  </div>
</body></html>
