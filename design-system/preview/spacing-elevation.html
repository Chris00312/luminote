<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.tile { width: 130px; height: 90px; background: #fff; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.tile .lbl { font-family: var(--ln-font-mono); font-size: 11px; color: var(--ln-fg2); }
.tile .lbl2 { font-size: 10px; color: var(--ln-fg4); }
.glow { width: 130px; height: 60px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--ln-font-mono); font-size: 11px; background: linear-gradient(135deg,#1a6b4a,#228b5b); }
</style></head><body>
  <div class="row">
    <div class="tile" style="box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)"><div class="lbl">elev-1</div><div class="lbl2">resting</div></div>
    <div class="tile" style="box-shadow:0 2px 8px rgba(0,0,0,.06)"><div class="lbl">elev-2</div><div class="lbl2">card</div></div>
    <div class="tile" style="box-shadow:0 4px 12px rgba(0,0,0,.08)"><div class="lbl">elev-3</div><div class="lbl2">raised</div></div>
    <div class="tile" style="box-shadow:0 8px 24px rgba(0,0,0,.10)"><div class="lbl">elev-4</div><div class="lbl2">modal</div></div>
  </div>
  <div class="row">
    <div class="glow" style="box-shadow:0 2px 8px rgba(26,107,74,.25)">glow primary</div>
    <div class="glow" style="box-shadow:0 8px 24px rgba(26,107,74,.35)">glow lg</div>
    <div class="tile" style="background:rgba(255,255,255,.7);box-shadow:0 2px 8px rgba(0,0,0,.04),inset 0 0 0 1px rgba(255,255,255,.5);border:1px solid rgba(232,239,234,.6)"><div class="lbl">glass</div><div class="lbl2">+inset hi</div></div>
  </div>
</body></html>
